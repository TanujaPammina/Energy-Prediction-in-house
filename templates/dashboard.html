<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ML Energy Dashboard</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background:#f8fafc;
    margin:0;
}
.container {
    max-width:1200px;
    margin:auto;
    padding:30px;
}
h1 {
    text-align:center;
    margin-bottom:10px;
}
.tabs {
    display:flex;
    gap:12px;
    justify-content:center;
    margin:25px 0;
}
.tab {
    padding:10px 22px;
    border-radius:20px;
    border:none;
    cursor:pointer;
    background:#e5e7eb;
    font-weight:600;
}
.tab.active {
    background:#6366f1;
    color:white;
}
.section { display:none; }
.section.active { display:block; }

.card-row {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:35px;
}
.card {
    background:white;
    padding:22px;
    border-radius:16px;
    text-align:center;
    box-shadow:0 12px 28px rgba(0,0,0,.1);
}
.card b { font-size:20px; }

.chart-box {
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 12px 28px rgba(0,0,0,.1);
}

.notice {
    background:#fff7ed;
    border-left:5px solid #f97316;
    padding:18px;
    border-radius:14px;
}
</style>
</head>

<body>
<div class="container">

<h1>🏢 ML Energy Dashboard</h1>

<!-- TABS -->
<div class="tabs">
    <button class="tab active" onclick="showTab('overview')">Overview</button>
    <button class="tab" onclick="showTab('analysis')">Data Analysis</button>
    <button class="tab" onclick="showTab('feature')">Feature Importance</button>
</div>

<!-- ================= OVERVIEW ================= -->
<div id="overview-section" class="section active">
<div class="card-row">
    <div class="card">MAE<br><b>{{ mae }}</b></div>
    <div class="card">RMSE<br><b>{{ rmse }}</b></div>
    <div class="card">RMSLE<br><b>{{ rmsle }}</b></div>
    <div class="card">R²<br><b>{{ r2 }}</b></div>
</div>

<div class="chart-box">
    <canvas id="metricChart"></canvas>
</div>
</div>

<!-- ================= DATA ANALYSIS ================= -->
<div id="analysis-section" class="section">

{% if heating|length == 0 %}
<div class="notice">
    <h3>📊 Analyze Energy Consumption</h3>
    <p>Please upload a dataset to see Heating, Cooling & Total Energy trends.</p>
    <a href="/upload"
       style="display:inline-block;margin-top:12px;
              background:#6366f1;color:white;
              padding:12px 20px;border-radius:12px;
              text-decoration:none;font-weight:600;">
        ⬆ Upload Dataset
    </a>
</div>
{% else %}
<div class="chart-box">
    <canvas id="energyChart"></canvas>
</div>
{% endif %}

</div>

<!-- ================= FEATURE IMPORTANCE ================= -->
<div id="feature-section" class="section">
<div class="chart-box">
    <canvas id="featureChart"></canvas>
</div>
</div>

</div>

<script>
/* ===== DATA FROM BACKEND ===== */
const mae = {{ mae }};
const rmse = {{ rmse }};
const rmsle = {{ rmsle }};
const r2 = {{ r2 }};

const heating = {{ heating | tojson }};
const cooling = {{ cooling | tojson }};
const total   = {{ total | tojson }};

let metricChart=null, energyChart=null, featureChart=null;

/* ===== TAB HANDLER ===== */
function showTab(tab){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById(tab+'-section').classList.add('active');

    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelector(`.tab[onclick="showTab('${tab}')"]`).classList.add('active');

    if(tab==="overview") drawMetricChart();
    if(tab==="analysis") drawEnergyChart();
    if(tab==="feature")  drawFeatureChart();
}

/* ===== METRIC CHART ===== */
function drawMetricChart(){
    if(metricChart) metricChart.destroy();
    metricChart = new Chart(document.getElementById("metricChart"),{
        type:"bar",
        data:{
            labels:["MAE","RMSE","RMSLE","R²"],
            datasets:[{
                data:[mae,rmse,rmsle,r2],
                backgroundColor:["#22c55e","#3b82f6","#f97316","#6366f1"],
                borderRadius:12
            }]
        },
        options:{responsive:true,scales:{y:{beginAtZero:true}}}
    });
}

/* ===== ENERGY GRAPH (AUTO LINE/BAR) ===== */
function drawEnergyChart(){
    if(energyChart) energyChart.destroy();
    if(heating.length === 0) return;

    const chartType = heating.length > 1 ? "line" : "bar";
    const labels = heating.map((_,i)=>`Sample ${i+1}`);

    energyChart = new Chart(document.getElementById("energyChart"),{
        type:chartType,
        data:{
            labels:labels,
            datasets:[
                {label:"Heating",data:heating,borderColor:"#f97316",backgroundColor:"#f97316",tension:0.4,pointRadius:chartType==="line"?3:0},
                {label:"Cooling",data:cooling,borderColor:"#3b82f6",backgroundColor:"#3b82f6",tension:0.4,pointRadius:chartType==="line"?3:0},
                {label:"Total",data:total,borderColor:"#22c55e",backgroundColor:"#22c55e",tension:0.4,pointRadius:chartType==="line"?3:0}
            ]
        },
        options:{responsive:true,plugins:{tooltip:{mode:"index",intersect:false}}}
    });
}

/* ===== FEATURE IMPORTANCE ===== */
function drawFeatureChart(){
    if(featureChart) featureChart.destroy();
    featureChart = new Chart(document.getElementById("featureChart"),{
        type:"bar",
        data:{
            labels:["Compactness","Height","Glazing","Surface","Wall","Roof","Orientation"],
            datasets:[{data:[0.95,0.9,0.82,0.74,0.69,0.61,0.4],backgroundColor:"#8b5cf6"}]
        },
        options:{indexAxis:"y"}
    });
}

/* ===== INITIAL LOAD ===== */
drawMetricChart();

/* 🔥 AUTO OPEN ANALYSIS AFTER DATASET UPLOAD */
document.addEventListener("DOMContentLoaded", ()=>{
{% if open_tab == "analysis" and heating|length > 0 %}
    showTab("analysis");
{% endif %}
});
</script>

</body>
</html>
